# Prometheus主配置文件 prometheus.yml
global:
  scrape_interval: 15s       # 默认抓取间隔15秒
  evaluation_interval: 15s   # 告警规则评估周期

rule_files:
  # - "rules/*.yml"  #告警规则文件，后续做告警可以打开

scrape_configs:
  # prometheus自身监控任务
  - job_name: 'prometheus'
    static_configs:
      - targets: ['127.0.0.1:9090']

  # Linux主机监控，node_exporter 9100端口
  - job_name: 'linux-node'
    static_configs:
      - targets: ['127.0.0.1:9100']
